<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Птички</title>
<meta name="description" content="Мерч птицефабрики: свайпайте цыпочек, ловите мэтчи и скидки.">
<meta name="theme-color" content="#1E8BFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Птички">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Onest:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: phone on a sky backdrop as the stage, flow rail beside it (stacks under it on narrow screens).
   Look: sky-blue gradients, clouds, frosted-glass pills, white cut-out circles, chunky lowercase display, stickers. */
:root {
  --page: #DCEEFF;
  --page-2: #F3F9FF;
  --page-ink: #0E1B33;
  --page-muted: #56688A;
  --rail: rgba(255,255,255,.7);
  --rail-line: rgba(14,27,51,.08);

  --sky-1: #1E8BFF;
  --sky-2: #5DB6FF;
  --sky-3: #BFE3FF;
  --cloud: #FFFFFF;
  --ink: #0E1B33;
  --muted: #7E8CA6;
  --line: rgba(14,27,51,.08);
  --surface: #FFFFFF;
  --glass: rgba(255,255,255,.58);
  --glass-line: rgba(255,255,255,.75);
  --cobalt: #1F48FF;
  --hot: #FF4436;
  --yolk: #FFC93C;

  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0B1426; --page-2: #13213D; --page-ink: #EAF2FF; --page-muted: #94A6C6;
    --rail: rgba(255,255,255,.06); --rail-line: rgba(255,255,255,.1);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0B1426; --page-2: #13213D; --page-ink: #EAF2FF; --page-muted: #94A6C6;
  --rail: rgba(255,255,255,.06); --rail-line: rgba(255,255,255,.1);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: radial-gradient(120% 80% at 20% 0%, var(--page-2), var(--page) 60%) fixed, var(--page);
  color: var(--page-ink); font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 40px; min-height: 100%;
}

/* ---------- phone ---------- */
.phone-fit { flex: none; width: min(390px, 100%); aspect-ratio: 390 / 812; max-width: 100%; position: relative; }
.phone {
  width: 390px; height: 812px; position: absolute; top: 0; left: 0; transform-origin: 0 0;
  border-radius: 58px; background: #11131B; padding: 11px;
  box-shadow: 0 0 0 2px #2A2F3D inset, 0 40px 80px -30px rgba(20,70,160,.55);
}
.screen-area {
  position: relative; width: 100%; height: 100%; border-radius: 48px; overflow: hidden;
  background: var(--surface); color: var(--ink); font-family: var(--body);
  container-type: size;
}
.island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 32%; height: 31px; background: #000; border-radius: 20px; z-index: 60; }
.status { position: absolute; top: 0; left: 0; right: 0; height: 52px; display: flex; justify-content: space-between; align-items: center; padding: 6px 32px 0; font: 700 15px var(--body); z-index: 50; pointer-events: none; color: #fff; }
.status.dark { color: var(--ink); }
.status .icons { display: flex; gap: 6px; align-items: center; }
.status .bat { width: 25px; height: 12px; border: 1.5px solid currentColor; border-radius: 4px; position: relative; opacity: .9; }
.status .bat::after { content: ""; position: absolute; inset: 1.5px; right: 5px; background: currentColor; border-radius: 1.5px; }
.homebar { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 36%; height: 5px; border-radius: 3px; background: var(--ink); z-index: 60; pointer-events: none; }

.screen { position: absolute; inset: 0; display: flex; flex-direction: column; animation: enter .4s ease both; }
@keyframes enter { from { opacity: 0; transform: scale(.98); } to { opacity: 1; transform: none; } }

/* sky + clouds */
.sky { background: linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 55%, var(--sky-3) 100%); overflow: hidden; }
.sky:not(.screen) { position: relative; }
.clouds { position: absolute; inset: 0; pointer-events: none; }
.clouds span { position: absolute; border-radius: 50%; background: var(--cloud); filter: blur(18px); opacity: .55; }
.clouds span:nth-child(1) { width: 220px; height: 90px; top: 8%; left: -60px; }
.clouds span:nth-child(2) { width: 180px; height: 70px; top: 26%; right: -50px; opacity: .45; }
.clouds span:nth-child(3) { width: 260px; height: 110px; top: 58%; left: 30%; opacity: .35; }
.clouds span:nth-child(4) { width: 160px; height: 60px; top: 80%; left: -40px; opacity: .5; }

.glass {
  background: var(--glass); border: 1px solid var(--glass-line);
  backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4);
}

.pill { border: none; border-radius: 999px; padding: 16px 24px; font: 700 16px var(--body); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
.pill-black { background: var(--ink); color: #fff; }
.pill-cobalt { background: var(--cobalt); color: #fff; box-shadow: 0 10px 24px -10px var(--cobalt); }
.pill-white { background: #fff; color: var(--ink); }
.pill.wide { width: 100%; }
.pill:active { transform: scale(.98); }
.pill .arrow { width: 22px; height: 22px; border-radius: 6px; background: rgba(255,255,255,.2); display: grid; place-items: center; }
.link { background: none; border: none; color: inherit; opacity: .75; font: 600 14px var(--body); cursor: pointer; padding: 10px; }
:is(.pill, .link, .iconbtn, .round, .chip, .tab, .field input):focus-visible { outline: 2px solid var(--cobalt); outline-offset: 2px; }

.iconbtn { width: 42px; height: 42px; border-radius: 50%; border: none; display: grid; place-items: center; cursor: pointer; color: var(--ink); position: relative; flex: none; }
.dot { position: absolute; top: 9px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--hot); border: 2px solid #fff; }

.sticker { position: absolute; z-index: 3; filter: drop-shadow(0 6px 10px rgba(14,27,51,.18)); animation: bob 3.2s ease-in-out infinite; }
.sticker:nth-of-type(2n) { animation-delay: -1.4s; }
@keyframes bob { 0%,100% { transform: translateY(0) rotate(var(--r, 0deg)); } 50% { transform: translateY(-8px) rotate(var(--r, 0deg)); } }

/* splash */
.splash { align-items: center; justify-content: center; gap: 4px; color: #fff; }
.splash .hero { width: 190px; position: relative; z-index: 2; animation: bob 2.4s ease-in-out infinite; }
.splash .logo { font: 900 52px/1 var(--display); letter-spacing: -.03em; position: relative; z-index: 2; margin-top: 8px; }
.splash .sub { font: 600 15px var(--body); opacity: .85; position: relative; z-index: 2; }
.loader { position: absolute; bottom: 64px; left: 50%; transform: translateX(-50%); width: 46%; height: 10px; border-radius: 6px; overflow: hidden; z-index: 2; padding: 2px; }
.loader i { display: block; height: 100%; width: 0; background: #fff; border-radius: 4px; animation: load 1.9s ease-in-out forwards; }
@keyframes load { to { width: 100%; } }

/* register */
.reg .top { height: 46%; display: grid; place-items: center; flex: none; }
.cutout { width: 170px; height: 170px; border-radius: 50%; background: #fff; display: grid; place-items: end center; position: relative; z-index: 2; margin-top: 40px; }
.cutout .art { width: 128%; margin-bottom: 4px; }
.reg .sheet { flex: 1; background: var(--surface); border-radius: 36px 36px 0 0; margin-top: -40px; position: relative; z-index: 3; padding: 26px 22px calc(var(--sab) + 16px); overflow: auto; display: flex; flex-direction: column; gap: 14px; }
.big { font: 900 40px/0.95 var(--display); letter-spacing: -.03em; margin: 0; text-transform: lowercase; }
.reg .big { text-align: center; }
.reg p.lead { margin: -4px 0 4px; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.45; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font: 600 12px var(--body); color: var(--muted); padding-left: 16px; }
.field input { border: 1px solid var(--line); background: #F3F7FC; border-radius: 999px; padding: 15px 18px; font: 600 16px var(--body); color: var(--ink); }
.field input:focus { border-color: var(--sky-1); background: #fff; outline: none; }
.legal { font-size: 11px; color: var(--muted); text-align: center; }

/* deck */
.deck { padding: calc(var(--sat) + 8px) 18px 0; }
.hello { display: flex; align-items: center; gap: 10px; border-radius: 999px; padding: 6px 6px 6px 6px; position: relative; z-index: 4; }
.ava { width: 40px; height: 40px; border-radius: 50%; background: var(--yolk); display: grid; place-items: center; overflow: hidden; flex: none; }
.ava svg { width: 46px; margin-top: 8px; }
.hello .who { flex: 1; min-width: 0; line-height: 1.15; }
.hello .who small { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
.hello .who b { font-size: 15px; }
.grains { text-align: center; color: #fff; position: relative; z-index: 2; margin-top: 10px; }
.grains small { font: 600 13px var(--body); opacity: .9; }
.grains h2 { font: 900 22px/1.1 var(--display); margin: 2px 0 0; letter-spacing: -.02em; text-transform: lowercase; }
.deck-wrap { position: relative; flex: 1; margin: 14px 8px 10px; z-index: 2; }
.card {
  position: absolute; inset: 0; border-radius: 34px; overflow: hidden; background: var(--surface);
  box-shadow: 0 24px 40px -22px rgba(14,40,100,.55); touch-action: none; user-select: none; cursor: grab;
  display: flex; flex-direction: column; will-change: transform; border: 1px solid rgba(255,255,255,.9);
}
.card:active { cursor: grabbing; }
.card .art { flex: 1; display: grid; place-items: center; position: relative; min-height: 0; margin: 8px 8px 0; border-radius: 28px; }
.card .art > svg { width: 72%; height: auto; max-height: 92%; }
.card .info { padding: 12px 18px 16px; display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.card .name { font: 900 24px/1 var(--display); margin: 0; letter-spacing: -.02em; text-transform: lowercase; }
.card .what { color: var(--muted); font: 500 13px var(--body); margin-top: 6px; }
.card .cost { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.card .cost s { display: block; color: var(--muted); font-size: 12px; }
.card .cost b { font: 800 16px var(--display); }
.card .tag { position: absolute; top: 12px; left: 12px; border-radius: 999px; padding: 6px 11px; font: 700 12px var(--body); color: var(--ink); }
.stamp { position: absolute; top: 30px; padding: 8px 16px; border-radius: 999px; font: 900 22px var(--display); opacity: 0; pointer-events: none; color: #fff; text-transform: lowercase; z-index: 2; }
.stamp.like { right: 20px; background: var(--hot); transform: rotate(10deg); }
.stamp.nope { left: 20px; background: var(--ink); transform: rotate(-10deg); }
.card.behind { transform: rotate(4deg) translateY(8px) scale(.96); }
.card.behind2 { transform: rotate(-5deg) translateY(14px) scale(.92); }
.empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; color: #fff; font-weight: 600; padding: 20px; }
.empty b { font: 900 20px var(--display); text-transform: lowercase; }
.actions { display: flex; justify-content: center; gap: 22px; position: relative; z-index: 3; margin: -40px 0 10px; }
.deck-wrap { margin-bottom: 0 !important; }
.card .info { padding-bottom: 40px !important; }
.hello .who small, .hello .who b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grains small { white-space: nowrap; }
.round { width: 60px; height: 60px; border-radius: 50%; border: none; cursor: pointer; display: grid; place-items: center; }
.round.no { color: var(--ink); }
.round.yes { background: var(--hot); color: #fff; box-shadow: 0 12px 24px -10px var(--hot); }
.round:active { transform: scale(.93); }

.tabbar { position: relative; z-index: 4; margin: 0 6px calc(var(--sab) + 6px); border-radius: 999px; padding: 6px; display: flex; justify-content: space-between; background: rgba(255,255,255,.88); box-shadow: 0 10px 30px -14px rgba(14,40,100,.5); }
.tab { flex: 1; min-width: 0; white-space: nowrap; border: none; background: none; border-radius: 999px; padding: 7px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 3px; font: 600 11px var(--body); color: var(--ink); cursor: pointer; position: relative; }
.tab[aria-current="page"] { color: var(--hot); }
.tab .badge { position: absolute; top: 2px; left: 56%; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--hot); color: #fff; font: 800 10px/17px var(--body); }

/* match */
.match { align-items: center; justify-content: center; text-align: center; color: #fff; padding: calc(var(--sat) + 12px) 24px calc(var(--sab) + 24px); gap: 10px; }
.match .cutout { width: 200px; height: 200px; margin-top: 0; animation: pop .6s cubic-bezier(.2,1.6,.4,1) both; }
.match .cutout .nm { position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%); white-space: nowrap; padding: 7px 14px; border-radius: 999px; font: 700 13px var(--body); color: var(--ink); }
.match h2 { font: 900 72px/1 var(--display); margin: 22px 0 0; letter-spacing: -.04em; animation: pop .6s .1s cubic-bezier(.2,1.6,.4,1) both; position: relative; z-index: 2; }
.match p { margin: 0 0 10px; opacity: .92; font-size: 15px; line-height: 1.45; max-width: 290px; position: relative; z-index: 2; }
.match .btns { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; z-index: 2; }
.confetti { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
.confetti i { position: absolute; top: -20px; width: 9px; height: 13px; border-radius: 3px; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(900px) rotate(540deg); } }
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }

/* product */
.product .top { height: 44%; flex: none; display: grid; place-items: center; }
.product .cutout { width: 190px; height: 190px; margin-top: 70px; }
.product .bar { position: absolute; top: calc(var(--sat) + 6px); left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; z-index: 5; }
.product .bar .crumb { color: #fff; font: 800 14px var(--display); text-transform: lowercase; }
.product .sheet { flex: 1; background: var(--surface); margin-top: -10px; position: relative; z-index: 3; padding: 28px 22px calc(var(--sab) + 12px); overflow: auto; display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center; }
.product .big { font-size: 46px; }
.meta { display: flex; gap: 18px; color: var(--muted); font-size: 13px; justify-content: center; flex-wrap: wrap; }
.about { display: inline-flex; gap: 6px; align-items: center; background: #F1F4F9; border-radius: 999px; padding: 6px 12px; font: 600 12px var(--body); color: var(--ink); }
.price { display: flex; align-items: baseline; gap: 10px; font-variant-numeric: tabular-nums; justify-content: center; margin-top: 4px; }
.price s { font: 600 17px var(--body); color: var(--muted); text-decoration-color: var(--hot); text-decoration-thickness: 2px; }
.price b { font: 900 32px var(--display); letter-spacing: -.02em; }
.price em { font-style: normal; background: var(--hot); color: #fff; padding: 4px 9px; border-radius: 999px; font: 800 12px var(--body); align-self: center; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.chip { min-width: 50px; padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line); background: #F3F7FC; font: 700 14px var(--body); color: var(--ink); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.timer { font-size: 12px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.product .spacer { flex: 1; }

/* thanks */
.thanks { align-items: center; justify-content: center; text-align: center; gap: 14px; padding: calc(var(--sat) + 12px) 24px calc(var(--sab) + 24px); }
.thanks .big { color: #fff; position: relative; z-index: 2; font-size: 38px; }
.thanks .heart { width: 230px; height: auto; position: relative; z-index: 2; animation: beat 1.4s ease-in-out infinite; filter: drop-shadow(0 18px 24px rgba(14,40,100,.3)); }
.thanks .order { position: relative; z-index: 2; border-radius: 24px; padding: 14px 18px; font-size: 14px; color: var(--ink); line-height: 1.5; }
.thanks .order b { font-variant-numeric: tabular-nums; }
.thanks .pill { position: relative; z-index: 2; margin-top: 6px; }
@keyframes beat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.06); } 30% { transform: scale(1); } 45% { transform: scale(1.04); } }

/* liked sheet */
.sheet-bg { position: absolute; inset: 0; background: rgba(14,27,51,.35); z-index: 30; display: flex; align-items: flex-end; }
.lsheet { background: #fff; width: 100%; border-radius: 34px 34px 0 0; padding: 12px 20px calc(var(--sab) + 20px); max-height: 72%; overflow: auto; animation: up .28s ease both; }
.lsheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 14px; }
@keyframes up { from { transform: translateY(100%); } to { transform: none; } }
.lsheet h3 { font: 900 22px var(--display); margin: 0 0 10px; text-transform: lowercase; }
.row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.row .thumb { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; flex: none; overflow: hidden; }
.row .thumb svg { width: 50px; height: 50px; }
.row .t { flex: 1; min-width: 0; font-weight: 700; font-size: 14px; }
.row .t small { display: block; color: var(--muted); font-weight: 500; }
.row button { font: 700 12px var(--body); border: none; background: var(--cobalt); color: #fff; border-radius: 999px; padding: 9px 14px; cursor: pointer; }

/* phone tab screens */
.tabscreen .tabbar { position: absolute; left: 12px; right: 12px; bottom: 0; margin: 0 0 calc(var(--sab) + 6px); }
.tabscreen .top { height: 40%; flex: none; display: grid; place-items: center; }
.tabscreen .top .cutout { margin-top: 56px; }
.tabscreen .sheet { flex: 1; background: var(--surface); margin-top: -12px; position: relative; z-index: 3; padding: 26px 22px 120px; display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center; overflow: auto; border-radius: 30px 30px 0 0; }
.tabscreen .big { font-size: 42px; }
.tabhead { padding: calc(var(--sat) + 16px) 22px 0; position: relative; z-index: 2; }
.nopet { position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px; color: #fff; padding: 0 32px 120px; }
.nopet .sticker { animation: wobble 1.8s ease-in-out infinite; transform-origin: 50% 90%; }
.nopet b { font: 900 22px var(--display); }
.nopet p { margin: 0; opacity: .9; line-height: 1.45; font-size: 15px; }
.pstats { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
.prow { display: grid; grid-template-columns: 22px 78px 1fr 30px; align-items: center; gap: 8px; text-align: left; font: 600 14px var(--body); }
.prow .pic svg { width: 18px; height: 18px; display: block; }
.prow i { height: 10px; border-radius: 5px; background: #EEF2F8; overflow: hidden; }
.prow i span { display: block; height: 100%; border-radius: 5px; transition: width .4s ease; }
.prow b { text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); }
.watchnote { display: flex; align-items: center; gap: 12px; text-align: left; background: #F1F6FD; border-radius: 20px; padding: 12px 14px; font: 600 13px/1.35 var(--body); width: 100%; margin-top: 4px; }
.watchnote svg { flex: none; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
.tiles div { background: #F1F6FD; border-radius: 18px; padding: 12px 6px; display: flex; flex-direction: column; gap: 2px; }
.tiles b { font: 900 18px var(--display); font-variant-numeric: tabular-nums; }
.tiles small { color: var(--muted); font-size: 11.5px; }
.sec { font: 900 20px var(--display); margin: 8px 0 0; align-self: flex-start; }
.orders { width: 100%; text-align: left; }
.orders .osum { font: 800 14px var(--display); white-space: nowrap; }
.orders .none { color: var(--muted); margin: 0; font-size: 14px; }


/* ---------- full-screen app ---------- */
:root { --sat: max(env(safe-area-inset-top, 0px), 18px); --sab: max(env(safe-area-inset-bottom, 0px), 14px); }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
body { padding: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; -webkit-font-smoothing: antialiased; }
.screen-area { position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; height: auto; border-radius: 0; container-type: normal; box-shadow: 0 0 80px -30px rgba(20,70,160,.4); }
.card, .tab, .pill, .round { -webkit-user-select: none; user-select: none; }
.hatching .cutout { animation: pop .7s cubic-bezier(.2,1.6,.4,1) both; }

/* =========================================================
   motion: transitions between screens, micro-interactions
   ========================================================= */
:root { --spring: cubic-bezier(.2, 1.5, .35, 1); --out: cubic-bezier(.2, .8, .2, 1); }

/* view transitions between screens */
html.vt .screen { animation: none; }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .42s; animation-timing-function: var(--out); }
html[data-nav="fwd"]::view-transition-old(root) { animation-name: vt-out-left; }
html[data-nav="fwd"]::view-transition-new(root) { animation-name: vt-in-right; }
html[data-nav="back"]::view-transition-old(root) { animation-name: vt-out-right; }
html[data-nav="back"]::view-transition-new(root) { animation-name: vt-in-left; }
html[data-nav="tab"]::view-transition-old(root) { animation: vt-fade-out .2s ease both; }
html[data-nav="tab"]::view-transition-new(root) { animation: vt-fade-in .26s ease both; }
html[data-nav="zoom"]::view-transition-old(root) { animation: vt-zoom-out .4s var(--out) both; }
html[data-nav="zoom"]::view-transition-new(root) { animation: vt-fade-in .4s ease both; }
html[data-nav="fade"]::view-transition-old(root) { animation: vt-fade-out .35s ease both; }
html[data-nav="fade"]::view-transition-new(root) { animation: vt-rise .5s var(--out) both; }
@keyframes vt-in-right { from { transform: translateX(28%); opacity: 0; } }
@keyframes vt-out-left { to { transform: translateX(-16%); opacity: 0; } }
@keyframes vt-in-left { from { transform: translateX(-16%); opacity: 0; } }
@keyframes vt-out-right { to { transform: translateX(28%); opacity: 0; } }
@keyframes vt-fade-in { from { opacity: 0; } }
@keyframes vt-fade-out { to { opacity: 0; } }
@keyframes vt-zoom-out { to { transform: scale(.9); opacity: 0; filter: blur(4px); } }
@keyframes vt-rise { from { transform: translateY(24px) scale(.98); opacity: 0; } }
::view-transition-group(hero) { animation-duration: .55s; animation-timing-function: cubic-bezier(.3, 1.25, .4, 1); }
::view-transition-old(hero), ::view-transition-new(hero) { animation-duration: .4s; }
::view-transition-group(tabbar), ::view-transition-group(tabpill) { animation-duration: .38s; animation-timing-function: var(--spring); }
.tabbar { view-transition-name: tabbar; }
.match .cutout, .product .cutout { view-transition-name: hero; }

/* press feedback everywhere */
.pill, .round, .tab, .chip, .iconbtn, .row button, .about, .gift { transition: transform .35s var(--spring), background-color .2s, color .2s, box-shadow .2s; }
.pill:active, .round:active, .chip:active, .iconbtn:active, .row button:active, .about:active { transform: scale(.92); transition-duration: .08s; }
.tab:active svg { transform: scale(.82); }
.tab svg { transition: transform .35s var(--spring); }

/* tab bar: sliding active pill */
.tab { z-index: 1; }
.tabpill { position: absolute; inset: 0; border-radius: 999px; background: #FFF0EE; z-index: -1; view-transition-name: tabpill; }
.tab[aria-current="page"] svg { animation: tab-hop .5s var(--spring); }
@keyframes tab-hop { 40% { transform: translateY(-4px) scale(1.12); } }

/* deck */
.card { transition: transform .45s var(--spring); }
.card.rise { animation: card-rise .5s var(--spring) both; }
@keyframes card-rise { from { transform: rotate(4deg) translateY(8px) scale(.96); } }
.card.behind.rise, .card.behind2.rise { animation: none; }
.card .art > svg { transition: transform .5s var(--spring); }
.card.liking .art > svg { transform: scale(1.12) rotate(-4deg); }
.card.liking { box-shadow: 0 0 0 4px var(--hot), 0 24px 40px -22px rgba(14,40,100,.55); }
.stamp { transition: transform .2s var(--spring); }
.round.yes.burst { animation: heart-pulse .5s var(--spring); }
.round.no.shake { animation: shake .4s ease; }
@keyframes heart-pulse { 30% { transform: scale(1.22); } }
@keyframes shake { 20% { transform: translateX(-6px) rotate(-8deg); } 50% { transform: translateX(5px) rotate(6deg); } 80% { transform: translateX(-2px); } }
.spark { position: absolute; pointer-events: none; z-index: 40; width: 16px; height: 16px; color: var(--hot); animation: spark .8s var(--out) forwards; }
@keyframes spark { from { transform: translate(-50%, -50%) scale(.4); opacity: 1; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1) rotate(var(--rot)); opacity: 0; } }
.hello { animation: drop-in .6s var(--spring) both; }
.grains h2 { animation: rise-in .6s .08s var(--spring) both; }
@keyframes drop-in { from { transform: translateY(-20px); opacity: 0; } }
@keyframes rise-in { from { transform: translateY(14px); opacity: 0; } }

/* match */
.match .rays { position: absolute; width: 520px; height: 520px; left: 50%; top: 38%; margin: -260px 0 0 -260px; border-radius: 50%; z-index: 0; pointer-events: none;
  background: repeating-conic-gradient(from 0deg, rgba(255,255,255,.16) 0deg 8deg, rgba(255,255,255,0) 8deg 22deg);
  -webkit-mask: radial-gradient(circle, #000 20%, transparent 68%); mask: radial-gradient(circle, #000 20%, transparent 68%);
  animation: spin 18s linear infinite, vt-fade-in .8s ease both; }
@keyframes spin { to { transform: rotate(360deg); } }
.match .cutout { animation: none; z-index: 2; }
.match .cutout .art { animation: wiggle 2.4s .6s ease-in-out infinite; }
@keyframes wiggle { 0%, 100% { transform: rotate(0); } 10% { transform: rotate(-6deg); } 20% { transform: rotate(5deg); } 30% { transform: rotate(0); } }
.match h2 { animation: none; display: flex; justify-content: center; }
.match h2 span { display: inline-block; animation: letter .7s var(--spring) both; }
@keyframes letter { from { transform: translateY(40px) scale(.4) rotate(-12deg); opacity: 0; } }
.match p, .match .btns { animation: rise-in .6s .45s var(--spring) both; }
.match .btns { animation-delay: .55s; }
.match .nm { animation: rise-in .5s .35s var(--spring) both; }

/* product */
.price s { position: relative; text-decoration: none; }
.price s::after { content: ""; position: absolute; left: -2px; right: -2px; top: 52%; height: 2px; background: var(--hot); transform-origin: left; animation: strike .5s .5s var(--out) both; }
@keyframes strike { from { transform: scaleX(0); } }
.price em { animation: badge .6s 1.1s var(--spring) both; }
@keyframes badge { from { transform: scale(0) rotate(-30deg); } }
.price b { min-width: 4.5ch; display: inline-block; }
.chip[aria-pressed="true"] { animation: chip-pop .4s var(--spring); }
@keyframes chip-pop { 40% { transform: scale(1.14); } }
.about { border: none; cursor: pointer; }
.about[aria-expanded="true"] { background: var(--ink); color: #fff; }
.desc { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s var(--out), opacity .3s; opacity: 0; width: 100%; }
.desc.open { grid-template-rows: 1fr; opacity: 1; }
.desc > div { overflow: hidden; font-size: 14px; line-height: 1.5; color: var(--muted); }
.likebtn svg { transition: transform .45s var(--spring); }
.likebtn.on svg { animation: heart-pulse .5s var(--spring); }
.product .sheet > * { animation: rise-in .55s var(--spring) both; }
.product .sheet > *:nth-child(2) { animation-delay: .05s; }
.product .sheet > *:nth-child(3) { animation-delay: .1s; }
.product .sheet > *:nth-child(4) { animation-delay: .15s; }
.product .sheet > *:nth-child(5) { animation-delay: .2s; }
.product .sheet > *:nth-child(6) { animation-delay: .25s; }
#payBtn { position: relative; overflow: hidden; }
#payBtn .fill { position: absolute; inset: 0; background: rgba(255,255,255,.25); transform-origin: left; transform: scaleX(0); }
#payBtn.paying .fill { animation: payfill .9s ease-in-out forwards; }
@keyframes payfill { to { transform: scaleX(1); } }
#payBtn.done { background: #22C55E; box-shadow: 0 10px 24px -10px #22C55E; }
#payBtn .check { width: 24px; height: 24px; }
#payBtn .check path { stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw .4s .05s ease forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }

/* thanks */
.thanks .big, .thanks .order, .thanks .pill, .thanks .link { animation: rise-in .6s var(--spring) both; }
.thanks .heart { animation: pop .7s .15s var(--spring) both, beat 1.4s 1s ease-in-out infinite; }
.thanks .order { animation-delay: .3s; } .thanks .pill { animation-delay: .4s; } .thanks .link { animation-delay: .5s; }
.floaty { position: absolute; bottom: -30px; z-index: 1; pointer-events: none; animation: floaty linear forwards; }
@keyframes floaty { to { transform: translateY(-110vh) rotate(var(--rot)); } }

/* my chick */
.petphone .cutout .art { cursor: pointer; transform-origin: 50% 90%; animation: idle 2.6s ease-in-out infinite; }
@keyframes idle { 0%, 100% { transform: translateY(0) scale(1); } 45% { transform: translateY(-5px) scale(1.01, .99); } 55% { transform: translateY(0) scale(1.02, .97); } }
.petphone .cutout .art.boing { animation: boing .6s var(--spring); }
@keyframes boing { 0% { transform: scale(1); } 25% { transform: translateY(4px) scale(1.12, .86); } 55% { transform: translateY(-26px) scale(.94, 1.08); } 100% { transform: none; } }
.peep { position: absolute; top: 18%; right: 14%; z-index: 4; background: #fff; color: var(--ink); font: 900 15px var(--display); padding: 6px 12px; border-radius: 16px 16px 16px 4px; pointer-events: none; animation: peep 1.1s var(--spring) forwards; }
@keyframes peep { 0% { transform: scale(0); opacity: 0; } 25% { transform: scale(1); opacity: 1; } 75% { opacity: 1; } 100% { transform: translateY(-16px); opacity: 0; } }
.prow i span { transition: width .9s var(--out); }
.pstats .prow { animation: rise-in .5s var(--spring) both; }
.pstats .prow:nth-child(2) { animation-delay: .06s; } .pstats .prow:nth-child(3) { animation-delay: .12s; } .pstats .prow:nth-child(4) { animation-delay: .18s; }
.hatchegg { position: absolute; inset: 0; display: grid; place-items: center; z-index: 3; pointer-events: none; }
.hatchegg .shell { position: relative; width: 112px; height: 140px; animation: egg-shake .5s ease-in-out 2; }
.hatchegg .half { position: absolute; inset: 0; }
.hatchegg .half.top { clip-path: polygon(0 0, 100% 0, 100% 50%, 86% 44%, 72% 54%, 57% 44%, 43% 54%, 28% 44%, 14% 54%, 0 46%); animation: shell-top .8s 1s var(--out) forwards; }
.hatchegg .half.bot { clip-path: polygon(0 46%, 14% 54%, 28% 44%, 43% 54%, 57% 44%, 72% 54%, 86% 44%, 100% 50%, 100% 100%, 0 100%); animation: shell-bot .8s 1s var(--out) forwards; }
@keyframes egg-shake { 25% { transform: rotate(-9deg); } 75% { transform: rotate(9deg); } }
@keyframes shell-top { to { transform: translate(-40px, -90px) rotate(-50deg); opacity: 0; } }
@keyframes shell-bot { to { transform: translateY(60px) rotate(10deg); opacity: 0; } }
.hatching .cutout { animation: none; }
.hatching .cutout .art { animation: pop .7s 1.1s var(--spring) both, idle 2.6s 2s ease-in-out infinite; }
.nopet .sticker { cursor: pointer; }

/* profile */
.tiles div { animation: rise-in .5s var(--spring) both; }
.tiles div:nth-child(2) { animation-delay: .06s; } .tiles div:nth-child(3) { animation-delay: .12s; }
.orders .row { animation: rise-in .5s var(--spring) both; }
.reset { background: none; border: none; color: var(--muted); font: 600 13px var(--body); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; margin-top: 8px; padding: 8px; }
.confirm { background: #FFF1EF; border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; width: 100%; font-size: 14px; animation: rise-in .4s var(--spring) both; }
.confirm div { display: flex; gap: 8px; justify-content: center; }
.confirm .pill { padding: 10px 16px; font-size: 14px; }

/* sheets */
.sheet-bg { animation: vt-fade-in .25s ease both; }
.sheet-bg.closing { animation: vt-fade-out .25s ease both; }
.lsheet { animation: sheet-up .5s var(--spring) both; touch-action: none; }
.sheet-bg.closing .lsheet { animation: sheet-down .25s ease-in both; }
@keyframes sheet-up { from { transform: translateY(100%); } }
@keyframes sheet-down { to { transform: translateY(100%); } }
.lsheet .row { animation: rise-in .45s var(--spring) both; }
.lsheet .row:nth-child(4) { animation-delay: .05s; } .lsheet .row:nth-child(5) { animation-delay: .1s; } .lsheet .row:nth-child(6) { animation-delay: .15s; } .lsheet .row:nth-child(7) { animation-delay: .2s; }
.lsheet .head { display: flex; align-items: center; justify-content: space-between; }
.lsheet .head h3 { margin: 0; }
.lsheet .x { width: 34px; height: 34px; border-radius: 50%; border: none; background: #F1F4F9; display: grid; place-items: center; cursor: pointer; color: var(--ink); }
.row button.bought { background: #E9F8EF; color: #15803D; cursor: default; }
.note { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--line); text-align: left; }
.note .ic { width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; flex: none; overflow: hidden; }
.note .ic svg { width: 40px; height: 40px; }
.note b { display: block; font-size: 14px; }
.note small { color: var(--muted); font-size: 12.5px; line-height: 1.35; display: block; }
.note .go2 { margin-left: auto; align-self: center; font: 700 12px var(--body); border: none; background: var(--cobalt); color: #fff; border-radius: 999px; padding: 8px 12px; cursor: pointer; }

/* splash */
.splash .logo span { display: inline-block; animation: letter .7s var(--spring) both; }
.splash .hero { animation: pop .7s var(--spring) both, bob 2.4s .7s ease-in-out infinite; }

@media (prefers-reduced-motion: reduce) {
  ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
}
</style>

      var tiles = document.getElementById("pfTiles"); if (!tiles) return;
      tiles.innerHTML =
        '<div><b data-n="' + state.orders + '">' + state.orders + '</b><small>' + plural(state.orders, "заказ", "заказа", "заказов") + '</small></div>' +
        '<div><b data-n="' + state.liked.length + '">' + state.liked.length + '</b><small>' + plural(state.liked.length, "мэтч", "мэтча", "мэтчей") + '</small></div>' +
        '<div><b data-n="' + saved() + '" data-rub="1">' + rub(saved()) + '</b><small>сэкономлено</small></div>';
      if (first) tiles.querySelectorAll("b").forEach(function (b) { countUp(b, +b.dataset.n, b.dataset.rub ? rub : String); });
      document.getElementById("pfOrders").innerHTML = state.orderList.length ? state.orderList.slice().reverse().map(function (o, i) {
        return '<div class="row" style="animation-delay:' + (0.15 + i * 0.06).toFixed(2) + 's"><div class="thumb" style="background:' + o.p.bg + '">' + o.p.art() + '</div><div class="t">' + esc(o.p.name) + '<small>' + o.num + ' · ' + esc(o.p.what) + (o.size ? ', ' + o.size : '') + '</small></div><b class="osum">' + rub(o.p.price) + '</b></div>';
      }).join("") : '<p class="none">Пока нет заказов. Смахните понравившуюся цыпу вправо.</p>';
    }
  }

  function openLiked(screenEl) {
    var body = state.liked.length ? state.liked.map(function (p) {
      return '<div class="row"><div class="thumb" style="background:' + p.bg + '">' + p.art() + '</div><div class="t">' + esc(p.name) + '<small>' + esc(p.what) + ' · ' + rub(p.price) + '</small></div>' +
        (isBought(p) ? '<button type="button" class="bought" data-open="' + p.id + '">Куплено</button>' : '<button type="button" data-id="' + p.id + '">Купить</button>') + '</div>';
    }).join("") : '<p style="color:var(--muted);margin:0 0 6px">Пока пусто. Смахните карточку вправо, чтобы получить мэтч.</p>';
    var bg = sheet(screenEl, "мои мэтчи", body);
    bg.addEventListener("click", function (e) {
      var b = e.target.closest("button[data-id], button[data-open]"); if (!b) return;
      var id = b.dataset.id || b.dataset.open;
      state.current = byId(id);
      state.backTo = state.screen;
      var thumb = b.closest(".row").querySelector(".thumb");
      thumb.style.viewTransitionName = "hero";
      go("product", "fwd");
    });
  }

  var STAT = {
    hunger: { t: "сытость", c: "#FFC93C", icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="#FFC93C"><ellipse cx="8" cy="9" rx="3" ry="4.5" transform="rotate(-20 8 9)"/><ellipse cx="16" cy="9" rx="3" ry="4.5" transform="rotate(20 16 9)"/><ellipse cx="12" cy="17" rx="3" ry="4.5"/></svg>' },
    clean: { t: "чистота", c: "#5DB6FF", icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="#5DB6FF"><path d="M12 2s7 8 7 13a7 7 0 0 1-14 0c0-5 7-13 7-13z"/></svg>' },
    fun: { t: "радость", c: "#FF6B5E", icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="#FF6B5E"><path d="M12 21s-7.5-4.6-9.5-9.3C1.1 8.4 3.2 4.5 7 4.5c2 0 3.5 1.1 5 3 1.5-1.9 3-3 5-3 3.8 0 5.9 3.9 4.5 7.2C19.5 16.4 12 21 12 21z"/></svg>' },
    energy: { t: "энергия", c: "#A98BFF", icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="#A98BFF"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>' }
  };
  var STATS = ["hunger", "clean", "fun", "energy"];
  var MOON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>';
  var SUN = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4.5" fill="#fff"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>';
  var ACT_ICON = {
    feed: '<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><ellipse cx="8" cy="9" rx="3" ry="4.5" transform="rotate(-20 8 9)"/><ellipse cx="16" cy="9" rx="3" ry="4.5" transform="rotate(20 16 9)"/><ellipse cx="12" cy="17" rx="3" ry="4.5"/></svg>',
    wash: '<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M12 2s7 8 7 13a7 7 0 0 1-14 0c0-5 7-13 7-13z"/></svg>',
    play: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><path d="M3.5 9.5c5 2 12 2 17 0M3.5 14.5c5-2 12-2 17 0"/></svg>'
  };

  function clamp(v) { return Math.max(0, Math.min(100, v)); }
  function product(id) { return PRODUCTS.find(function (p) { return p.id === id; }); }

  function adopt(p) {
    state.pet = { id: p.id, name: p.name, hunger: 70, clean: 85, fun: 60, energy: 80, sleeping: false, born: Date.now(), t: Date.now() };
  }
  function ensurePet() { if (!state.pet) adopt(PRODUCTS[1]); }

  // настроение: что сейчас нужнее всего
  function moodOf(pet) {
    if (pet.sleeping) return { key: "sleep", text: "спит" };
    var low = STATS.slice().sort(function (a, b) { return pet[a] - pet[b]; })[0];
    if (pet[low] >= 65) return { key: "happy", text: "счастлив" };
    if (pet[low] >= 40) return { key: "ok", text: "всё хорошо" };
    return { hunger: { key: "hungry", text: "проголодался" }, clean: { key: "dirty", text: "испачкался" }, fun: { key: "bored", text: "скучает" }, energy: { key: "tired", text: "устал, хочет спать" } }[low];
  }
  function petSVG(pet, moodKey) {
    var eyes = { happy: "happy", ok: null, hungry: "sad", dirty: null, bored: "bored", tired: "bored", sleep: "sleep" }[moodKey];
    var dirt = pet.clean < 55 ? (0.25 + 0.75 * (1 - pet.clean / 55)).toFixed(2) : 0;
    return bird(Object.assign({}, LOOKS[pet.id] || {}, { mood: eyes, dirt: dirt }));
  }


  // цыпа живёт в реальном времени: за час немного голодает, пачкается, скучает и устаёт
  var RATE = { hunger: 6, clean: 4, fun: 5, energy: 3 };
  function tickPet() {
    var pet = state.pet; if (!pet) return;
    var hrs = (Date.now() - (pet.t || Date.now())) / 3600000;
    if (hrs <= 0) return;
    STATS.forEach(function (s) { pet[s] = clamp(pet[s] - RATE[s] * hrs); });
    pet.t = Date.now();
    save();
  }
  setInterval(function () { tickPet(); if (state.screen === "mypet" || state.screen === "profile") refreshPhone(); }, 30000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) { tickPet(); refreshPhone(); } });

  load();
  tickPet();
  go("splash");

  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
})();
</script>
</body>
</html>
