<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Птички</title>
<meta name="description" content="Мерч птицефабрики: свайпайте цыпочек, ловите мэтчи и скидки.">
<meta name="theme-color" content="#FFD60A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Птички">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&family=Shantell+Sans:wght@500;700&display=swap">
<style>
/* Мир: чернильные цыпы на дофаминовых полях. Светлая тёплая земля, чёрные персонажи и кнопки,
   у каждого товара сплошное поле своего цвета, рисованные каракули, облачка реплик. */
:root {
  --ground: #F3F2EF;
  --paper: #FFFFFF;
  --ink: #151515;
  --ink-2: #4A4744;
  --line: rgba(21,21,21,.12);
  --pink: #FF3D8B;
  --bubblegum: #FF7FB6;
  --yellow: #FFD60A;
  --tangerine: #FF8A2A;
  --lime: #C8F23C;
  --lilac: #A99BFF;
  --cyan: #36C8FF;
  --coral: #FF6A5C;
  --display: "Rubik", "Arial Rounded MT Bold", system-ui, sans-serif;
  --hand: "Shantell Sans", "Comic Sans MS", "Rubik", cursive;
  --body: "Rubik", system-ui, -apple-system, sans-serif;
  --sat: max(env(safe-area-inset-top, 0px), 18px);
  --sab: max(env(safe-area-inset-bottom, 0px), 14px);
  --spring: cubic-bezier(.2, 1.5, .35, 1);
  --out: cubic-bezier(.2, .8, .2, 1);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
body { background: var(--ground); color: var(--ink); font-family: var(--body); -webkit-tap-highlight-color: transparent; touch-action: manipulation; -webkit-font-smoothing: antialiased; }
::selection { background: var(--yellow); color: var(--ink); }
button { font-family: inherit; color: inherit; }
input { caret-color: var(--pink); }
:is(button, input, [role="button"]):focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

.screen-area { position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; overflow: hidden; background: var(--ground); }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; animation: enter .4s var(--out) both; background: var(--ground); }
@keyframes enter { from { opacity: 0; transform: translateY(10px); } }
.tint { color: var(--ink); }

/* рисованные каракули на полях */
.doodles { position: absolute; inset: 0; pointer-events: none; color: var(--ink); opacity: .9; }
.doodles .dd { position: absolute; }
.dd.d1 { width: 70px; top: 18%; left: -10px; transform: rotate(-12deg); }
.dd.d2 { width: 26px; top: 12%; right: 18%; }
.dd.d3 { width: 52px; bottom: 26%; right: -6px; transform: rotate(10deg); }
.dd.d4 { width: 18px; bottom: 34%; left: 12%; }
.screen:not(.tint):not(.match):not(.splash) > .doodles { display: none; }
.sticker { position: absolute; z-index: 3; animation: bob 3.2s ease-in-out infinite; }
.sticker:nth-of-type(2n) { animation-delay: -1.4s; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(var(--r, 0deg)); } 50% { transform: translateY(-7px) rotate(var(--r, 0deg)); } }

/* облачко реплики */
.bubble { position: relative; z-index: 4; margin: 0; background: var(--paper); border: 3px solid var(--ink); border-radius: 22px; padding: 10px 16px; font: 700 16px/1.3 var(--hand); color: var(--ink); max-width: 300px; text-align: center; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -11px; width: 16px; height: 16px; background: var(--paper); border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink); transform: translateX(-50%) rotate(45deg); border-bottom-right-radius: 4px; }
.bubble.pop { animation: say-pop .5s var(--spring); }
@keyframes say-pop { from { transform: scale(.7) rotate(-6deg); opacity: 0; } }

/* кнопки */
.pill { border: none; border-radius: 999px; padding: 17px 26px; font: 800 17px var(--display); letter-spacing: -.01em; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
.pill-black { background: var(--ink); color: var(--paper); }
.pill-white { background: var(--paper); color: var(--ink); border: 3px solid var(--ink); padding: 14px 23px; }
.pill.wide { width: 100%; }
.pill .arrow { width: 24px; height: 24px; border-radius: 50%; background: var(--yellow); color: var(--ink); display: grid; place-items: center; }
.pill:disabled { cursor: default; }
.link { background: none; border: none; color: var(--ink); font: 600 15px var(--body); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; cursor: pointer; padding: 12px; }
.iconbtn { width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--ink); background: var(--paper); display: grid; place-items: center; cursor: pointer; color: var(--ink); position: relative; flex: none; padding: 0; }
.dot { position: absolute; top: 6px; right: 7px; width: 11px; height: 11px; border-radius: 50%; background: var(--pink); border: 2.5px solid var(--paper); }

/* заставка */
.splash { background: var(--yellow); align-items: center; justify-content: center; gap: 0; }
.splash .hero { width: 210px; position: relative; z-index: 2; }
.splash .logo { font: 900 68px/1 var(--display); letter-spacing: -.045em; margin-top: 6px; position: relative; z-index: 2; }
.splash .sub { font: 700 17px var(--hand); margin-top: 8px; position: relative; z-index: 2; }
.loader { position: absolute; bottom: calc(var(--sab) + 50px); left: 50%; transform: translateX(-50%); width: 44%; height: 14px; border-radius: 99px; border: 3px solid var(--ink); background: var(--paper); overflow: hidden; z-index: 2; }
.loader i { display: block; height: 100%; width: 0; background: var(--pink); animation: load 1.5s var(--out) forwards; }
@keyframes load { to { width: 100%; } }

/* регистрация */
.reg { background: var(--ground); }
.reg .top { height: 47%; flex: none; display: grid; place-items: end center; position: relative; overflow: hidden; }
.cutout { position: relative; z-index: 2; display: grid; place-items: end center; }
.reg .cutout { width: 190px; margin-bottom: 6px; }
.cutout .art { width: 100%; }
.cutout .art svg { display: block; width: 100%; height: auto; }
.reg .sheet { flex: 1; background: var(--ground); position: relative; z-index: 3; padding: 22px 22px calc(var(--sab) + 16px); display: flex; flex-direction: column; gap: 14px; overflow: auto; }
.big { font: 900 44px/.95 var(--display); letter-spacing: -.04em; margin: 0; text-wrap: balance; }
.reg .big { text-align: center; }
.reg p.lead { margin: -4px 0 4px; text-align: center; color: var(--ink-2); font-size: 15px; line-height: 1.45; }
.field label { font: 700 14px var(--hand); color: var(--ink); padding-left: 6px; }
.reg .field { display: flex; flex-direction: column; gap: 6px; }
.reg .field input { border: 3px solid var(--ink); background: var(--paper); border-radius: 18px; padding: 15px 18px; font: 500 17px var(--body); color: var(--ink); outline: none; }
.reg .field input::placeholder { color: #8D8984; }
.reg .field input:focus { box-shadow: 0 0 0 4px var(--yellow); }
.legal { font-size: 12px; color: var(--ink-2); text-align: center; }

/* колода */
.deck { padding: calc(var(--sat) + 6px) 18px 0; }
.appbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; animation: drop-in .6s var(--spring) both; }
.wordmark { display: block; font: 900 34px/1 var(--display); letter-spacing: -.05em; }
.hi { display: block; font: 600 13px var(--body); color: var(--ink-2); margin-top: 3px; }
.say { align-self: center; margin: 14px 0 4px; }
.deck-wrap { position: relative; flex: 1; margin: 16px 6px 0; z-index: 2; min-height: 0; }
.card { position: absolute; inset: 0; border-radius: 34px; overflow: hidden; border: 3px solid var(--ink); touch-action: none; user-select: none; cursor: grab; display: flex; flex-direction: column; will-change: transform; transition: transform .45s var(--spring); }
.card:active { cursor: grabbing; }
.card .art { flex: 1; display: grid; place-items: center; min-height: 0; position: relative; }
.card .art > svg { width: 70%; max-height: 94%; height: auto; transition: transform .5s var(--spring); }
.card .info { padding: 0 18px 54px; display: flex; flex-direction: column; gap: 10px; }
.card .name { font: 900 34px/1 var(--display); letter-spacing: -.04em; margin: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags span { background: var(--paper); border: 2.5px solid var(--ink); border-radius: 999px; padding: 6px 12px; font: 600 13.5px var(--body); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tags span.hot { background: var(--ink); color: var(--paper); }
.tags s { color: var(--ink-2); text-decoration-thickness: 2px; }
.stamp { position: absolute; top: 24px; padding: 6px 16px; border-radius: 14px; border: 3px solid var(--ink); font: 900 26px var(--display); opacity: 0; pointer-events: none; z-index: 2; transition: transform .2s var(--spring); }
.stamp.like { right: 18px; background: var(--lime); transform: rotate(10deg); }
.stamp.nope { left: 18px; background: var(--paper); transform: rotate(-10deg); }
.card.behind { transform: rotate(4deg) translateY(8px) scale(.96); }
.card.behind2 { transform: rotate(-5deg) translateY(14px) scale(.92); }
.card.rise { animation: card-rise .5s var(--spring) both; }
@keyframes card-rise { from { transform: rotate(4deg) translateY(8px) scale(.96); } }
.card.behind.rise, .card.behind2.rise { animation: none; }
.card.liking .art > svg { transform: scale(1.1) rotate(-4deg); }
.empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; border: 3px dashed var(--ink); border-radius: 34px; padding: 20px; }
.empty .emptyart { width: 150px; }
.empty b { font: 900 22px var(--display); letter-spacing: -.03em; }
.empty span { color: var(--ink-2); font-size: 15px; margin-bottom: 8px; }
.actions { display: flex; justify-content: center; gap: 20px; position: relative; z-index: 3; margin: -36px 0 12px; }
.round { width: 68px; height: 68px; border-radius: 50%; border: 3px solid var(--ink); cursor: pointer; display: grid; place-items: center; padding: 0; }
.round.no { background: var(--paper); color: var(--ink); }
.round.yes { background: var(--ink); color: var(--pink); }
.round.yes.burst { animation: heart-pulse .5s var(--spring); }
.round.no.shake { animation: shake .4s ease; }
@keyframes heart-pulse { 30% { transform: scale(1.2); } }
@keyframes shake { 20% { transform: translateX(-6px) rotate(-8deg); } 50% { transform: translateX(5px) rotate(6deg); } 80% { transform: translateX(-2px); } }

/* таб-бар */
.tabbar { position: relative; z-index: 4; margin: 0 4px calc(var(--sab) + 6px); border-radius: 999px; padding: 6px; display: flex; background: var(--paper); border: 3px solid var(--ink); view-transition-name: tabbar; }
.tab { flex: 1; min-width: 0; white-space: nowrap; border: none; background: none; border-radius: 999px; padding: 8px 2px 7px; display: flex; flex-direction: column; align-items: center; gap: 3px; font: 600 11.5px var(--body); color: var(--ink); cursor: pointer; position: relative; z-index: 1; }
.tab svg { transition: transform .35s var(--spring); }
.tab[aria-current="page"] { color: var(--paper); }
.tabpill { position: absolute; inset: 0; border-radius: 999px; background: var(--ink); z-index: -1; view-transition-name: tabpill; }
.tab[aria-current="page"] svg { animation: tab-hop .5s var(--spring); }
@keyframes tab-hop { 40% { transform: translateY(-4px) scale(1.12); } }
.tab .badge { position: absolute; top: 1px; left: 56%; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; background: var(--pink); color: var(--paper); border: 2px solid var(--paper); font: 800 10.5px/15px var(--body); text-align: center; }
.tabscreen .tabbar { position: absolute; left: 14px; right: 14px; bottom: 0; margin: 0 0 calc(var(--sab) + 6px); }

/* мэтч: экран залит цветом цыпы */
.match { align-items: center; justify-content: center; text-align: center; padding: calc(var(--sat) + 12px) 24px calc(var(--sab) + 18px); gap: 10px; }
.match .burst { position: absolute; left: 50%; top: 40%; width: 320px; height: 320px; margin: -160px 0 0 -160px; z-index: 1; animation: burst-in .7s .15s var(--spring) both, spin 26s linear infinite; }
.match .burst svg { width: 100%; height: 100%; }
@keyframes burst-in { from { transform: scale(.5); opacity: 0; } }
@keyframes spin { to { transform: rotate(360deg); } }
.match .cutout { width: 220px; z-index: 2; view-transition-name: hero; }
.match .cutout .art { animation: wiggle 2.4s .6s ease-in-out infinite; }
@keyframes wiggle { 0%, 100% { transform: rotate(0); } 10% { transform: rotate(-6deg); } 20% { transform: rotate(5deg); } 30% { transform: rotate(0); } }
.match .nm { position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%) rotate(-3deg); white-space: nowrap; padding: 6px 16px; border-radius: 999px; background: var(--paper); border: 3px solid var(--ink); font: 800 15px var(--display); animation: rise-in .5s .35s var(--spring) both; }
.match h2 { font: 900 84px/1 var(--display); margin: 20px 0 0; letter-spacing: -.05em; display: flex; justify-content: center; position: relative; z-index: 2; }
.match h2 span { display: inline-block; animation: letter .7s var(--spring) both; }
@keyframes letter { from { transform: translateY(40px) scale(.4) rotate(-12deg); opacity: 0; } }
.match p { margin: 0 0 8px; font: 500 16px/1.45 var(--body); max-width: 300px; position: relative; z-index: 2; animation: rise-in .6s .45s var(--spring) both; }
.match .btns { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 0; position: relative; z-index: 2; animation: rise-in .6s .55s var(--spring) both; }
.confetti { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
.confetti i { position: absolute; top: -20px; width: 10px; height: 14px; border-radius: 3px; border: 2px solid var(--ink); animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(900px) rotate(540deg); } }
.flood { position: absolute; inset: 0; z-index: 50; pointer-events: none; clip-path: circle(0 at var(--x) var(--y)); animation: flood .45s cubic-bezier(.6, 0, .3, 1) forwards; transition: opacity .4s ease; }
.flood.out { opacity: 0; }
@keyframes flood { to { clip-path: circle(var(--r) at var(--x) var(--y)); } }

/* товар */
.product .top { height: 46%; flex: none; display: grid; place-items: end center; position: relative; overflow: hidden; }
.product .cutout { width: 200px; margin-bottom: 4px; view-transition-name: hero; }
.product .bar { position: absolute; top: calc(var(--sat) + 4px); left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; z-index: 5; }
.product .bar .crumb { font: 800 15px var(--display); }
.product .sheet { flex: 1; position: relative; z-index: 3; padding: 22px 22px calc(var(--sab) + 12px); display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center; overflow: auto; }
.product .sheet > * { animation: rise-in .55s var(--spring) both; }
.product .sheet > *:nth-child(2) { animation-delay: .05s; } .product .sheet > *:nth-child(3) { animation-delay: .1s; } .product .sheet > *:nth-child(4) { animation-delay: .15s; } .product .sheet > *:nth-child(5) { animation-delay: .2s; } .product .sheet > *:nth-child(6) { animation-delay: .25s; }
.product .big { font-size: 46px; }
.meta { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.meta span { border: 2.5px solid var(--ink); border-radius: 999px; padding: 5px 12px; font: 600 13.5px var(--body); background: var(--paper); }
.about { display: inline-flex; gap: 6px; align-items: center; background: none; border: none; font: 700 15px var(--hand); color: var(--ink); cursor: pointer; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.about[aria-expanded="true"] { text-decoration-color: var(--pink); }
.desc { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s var(--out), opacity .3s; opacity: 0; width: 100%; }
.desc.open { grid-template-rows: 1fr; opacity: 1; }
.desc > div { overflow: hidden; font-size: 15px; line-height: 1.5; color: var(--ink-2); max-width: 36ch; margin: 0 auto; }
.price { display: flex; align-items: baseline; gap: 10px; justify-content: center; font-variant-numeric: tabular-nums; }
.price s { position: relative; text-decoration: none; font: 600 18px var(--body); color: var(--ink-2); }
.price s::after { content: ""; position: absolute; left: -2px; right: -2px; top: 52%; height: 3px; background: var(--pink); border-radius: 2px; transform-origin: left; animation: strike .5s .5s var(--out) both; }
@keyframes strike { from { transform: scaleX(0); } }
.price b { font: 900 38px var(--display); letter-spacing: -.03em; min-width: 4.5ch; display: inline-block; }
.price em { font-style: normal; background: var(--lime); border: 2.5px solid var(--ink); padding: 3px 10px; border-radius: 999px; font: 800 13px var(--display); align-self: center; animation: badge .6s 1.1s var(--spring) both; }
@keyframes badge { from { transform: scale(0) rotate(-30deg); } }
.chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.chip { min-width: 52px; padding: 9px 14px; border-radius: 999px; border: 2.5px solid var(--ink); background: var(--paper); font: 700 15px var(--body); color: var(--ink); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); animation: chip-pop .4s var(--spring); }
@keyframes chip-pop { 40% { transform: scale(1.14); } }
.timer { font: 700 14px var(--hand); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.product .spacer { flex: 1; }
.likebtn svg { transition: transform .45s var(--spring); }
.likebtn.on svg { animation: heart-pulse .5s var(--spring); }
#payBtn { position: relative; overflow: hidden; }
#payBtn .fill { position: absolute; inset: 0; background: var(--pink); transform-origin: left; transform: scaleX(0); }
#payBtn.paying .fill { animation: payfill .9s ease-in-out forwards; }
@keyframes payfill { to { transform: scaleX(1); } }
#payBtn.done { background: var(--lime); color: var(--ink); }
#payBtn .check { width: 24px; height: 24px; }
#payBtn .check path { stroke: var(--ink); stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw .4s .05s ease forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }

/* спасибо */
.thanks { align-items: center; justify-content: center; text-align: center; gap: 14px; padding: calc(var(--sat) + 12px) 24px calc(var(--sab) + 20px); }
.thanks .big { position: relative; z-index: 2; font-size: 42px; animation: rise-in .6s var(--spring) both; }
.thanks .heart { width: 220px; height: auto; position: relative; z-index: 2; animation: pop .7s .15s var(--spring) both, beat 1.4s 1s ease-in-out infinite; }
@keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.06); } 30% { transform: scale(1); } 45% { transform: scale(1.04); } }
.thanks .order { position: relative; z-index: 2; background: var(--paper); border: 3px solid var(--ink); border-radius: 22px; padding: 14px 18px; font-size: 15px; line-height: 1.5; animation: rise-in .6s .3s var(--spring) both; font-variant-numeric: tabular-nums; }
.thanks .pill { position: relative; z-index: 2; animation: rise-in .6s .4s var(--spring) both; }
.thanks .link { animation: rise-in .6s .5s var(--spring) both; }
.floaty { position: absolute; bottom: -30px; z-index: 1; pointer-events: none; animation: floaty linear forwards; }
@keyframes floaty { to { transform: translateY(-110vh) rotate(var(--rot)); } }

/* шторки */
.sheet-bg { position: absolute; inset: 0; background: rgba(21,21,21,.4); z-index: 30; display: flex; align-items: flex-end; animation: vt-fade-in .25s ease both; }
.sheet-bg.closing { animation: vt-fade-out .25s ease both; }
.lsheet { background: var(--ground); width: 100%; border-radius: 30px 30px 0 0; border: 3px solid var(--ink); border-bottom: none; padding: 10px 20px calc(var(--sab) + 20px); max-height: 74%; overflow: auto; animation: sheet-up .5s var(--spring) both; touch-action: none; }
.sheet-bg.closing .lsheet { animation: sheet-down .25s ease-in both; }
@keyframes sheet-up { from { transform: translateY(100%); } }
@keyframes sheet-down { to { transform: translateY(100%); } }
.lsheet .grab { width: 44px; height: 5px; border-radius: 3px; background: var(--ink); margin: 0 auto 12px; opacity: .3; }
.lsheet .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.lsheet h3 { font: 900 26px var(--display); letter-spacing: -.03em; margin: 0; }
.lsheet .x { width: 38px; height: 38px; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--paper); display: grid; place-items: center; cursor: pointer; padding: 0; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 2px dashed var(--line); animation: rise-in .45s var(--spring) both; }
.row .thumb { width: 54px; height: 54px; border-radius: 16px; border: 2.5px solid var(--ink); display: grid; place-items: center; flex: none; overflow: hidden; }
.row .thumb svg { width: 50px; height: 50px; }
.row .t { flex: 1; min-width: 0; font: 700 16px var(--display); }
.row .t small { display: block; color: var(--ink-2); font: 500 13px var(--body); margin-top: 2px; }
.row button { font: 700 13px var(--body); border: none; background: var(--ink); color: var(--paper); border-radius: 999px; padding: 10px 14px; cursor: pointer; }
.row button.bought { background: var(--lime); color: var(--ink); border: 2px solid var(--ink); }
.note { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 2px dashed var(--line); text-align: left; }
.note .ic { width: 44px; height: 44px; border-radius: 14px; border: 2.5px solid var(--ink); display: grid; place-items: center; flex: none; overflow: hidden; }
.note .ic svg { width: 40px; height: 40px; }
.note b { display: block; font: 700 15px var(--display); }
.note small { color: var(--ink-2); font-size: 13px; line-height: 1.35; display: block; margin-top: 2px; }
.note .go2 { margin-left: auto; align-self: center; font: 700 13px var(--body); border: none; background: var(--ink); color: var(--paper); border-radius: 999px; padding: 9px 13px; cursor: pointer; }

/* вкладки «Цыпа» и «Профиль» */
.tabscreen .top { height: 44%; flex: none; display: grid; place-items: end center; position: relative; overflow: hidden; }
.tabscreen .top .cutout { width: 200px; margin-bottom: 4px; }
.tabscreen .sheet { flex: 1; position: relative; z-index: 3; padding: 20px 22px 124px; display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center; overflow: auto; }
.tabscreen .big { font-size: 44px; }
.tabhead { padding: calc(var(--sat) + 16px) 22px 0; position: relative; z-index: 2; }
.nopet { position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px; padding: 0 32px 130px; }
.nopet .sticker { animation: wobble 1.8s ease-in-out infinite; transform-origin: 50% 90%; cursor: pointer; }
@keyframes wobble { 0%, 60%, 100% { transform: rotate(0); } 70% { transform: rotate(-8deg); } 80% { transform: rotate(7deg); } 90% { transform: rotate(-4deg); } }
.nopet b { font: 900 26px var(--display); letter-spacing: -.03em; }
.nopet p { margin: 0 0 6px; line-height: 1.45; font-size: 16px; }
.pstats { width: 100%; display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
.prow { display: grid; grid-template-columns: 22px 84px 1fr 32px; align-items: center; gap: 8px; text-align: left; font: 600 15px var(--body); animation: rise-in .5s var(--spring) both; }
.pstats .prow:nth-child(2) { animation-delay: .06s; } .pstats .prow:nth-child(3) { animation-delay: .12s; } .pstats .prow:nth-child(4) { animation-delay: .18s; }
.prow .pic svg { width: 19px; height: 19px; display: block; }
.prow i { height: 14px; border-radius: 99px; border: 2.5px solid var(--ink); background: var(--paper); overflow: hidden; }
.prow i span { display: block; height: 100%; transition: width .9s var(--out); border-right: 2.5px solid var(--ink); }
.prow b { text-align: right; font: 800 14px var(--display); font-variant-numeric: tabular-nums; }
.watchnote { display: flex; align-items: center; gap: 12px; text-align: left; background: var(--paper); border: 2.5px dashed var(--ink); border-radius: 20px; padding: 12px 14px; font: 600 14px/1.35 var(--body); width: 100%; margin-top: 4px; }
.watchnote svg { flex: none; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
.tiles div { background: var(--paper); border: 2.5px solid var(--ink); border-radius: 20px; padding: 12px 6px; display: flex; flex-direction: column; gap: 2px; animation: rise-in .5s var(--spring) both; }
.tiles div:nth-child(1) { background: var(--bubblegum); } .tiles div:nth-child(2) { background: var(--cyan); animation-delay: .06s; } .tiles div:nth-child(3) { background: var(--lime); animation-delay: .12s; }
.tiles b { font: 900 22px var(--display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.tiles small { font-size: 12px; font-weight: 600; }
.sec { font: 900 24px var(--display); letter-spacing: -.03em; margin: 8px 0 0; align-self: flex-start; }
.orders { width: 100%; text-align: left; }
.orders .osum { font: 800 15px var(--display); white-space: nowrap; }
.orders .none { color: var(--ink-2); margin: 0; font-size: 15px; }
.reset { background: none; border: none; color: var(--ink-2); font: 600 14px var(--body); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; margin-top: 8px; padding: 8px; }
.confirm { background: var(--paper); border: 3px solid var(--ink); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 10px; width: 100%; font-size: 15px; animation: rise-in .4s var(--spring) both; }
.confirm div { display: flex; gap: 8px; justify-content: center; }
.confirm .pill { padding: 11px 18px; font-size: 15px; }
.petphone .cutout .art { cursor: pointer; transform-origin: 50% 90%; animation: idle 2.6s ease-in-out infinite; }
@keyframes idle { 0%, 100% { transform: translateY(0) scale(1); } 45% { transform: translateY(-5px) scale(1.01, .99); } 55% { transform: translateY(0) scale(1.02, .97); } }
.petphone .cutout .art.boing { animation: boing .6s var(--spring); }
@keyframes boing { 0% { transform: scale(1); } 25% { transform: translateY(4px) scale(1.12, .86); } 55% { transform: translateY(-26px) scale(.94, 1.08); } 100% { transform: none; } }
.peep { position: absolute; top: calc(var(--sat) + 30px); right: 12%; z-index: 4; background: var(--paper); border: 3px solid var(--ink); font: 700 17px var(--hand); padding: 6px 14px; border-radius: 18px 18px 18px 4px; pointer-events: none; animation: peep 1.1s var(--spring) forwards; }
@keyframes peep { 0% { transform: scale(0); opacity: 0; } 25% { transform: scale(1); opacity: 1; } 75% { opacity: 1; } 100% { transform: translateY(-16px); opacity: 0; } }
.hatchegg { position: absolute; inset: 0; display: grid; place-items: end center; padding-bottom: 20px; z-index: 3; pointer-events: none; }
.hatchegg .shell { position: relative; width: 120px; height: 150px; animation: egg-shake .5s ease-in-out 2; }
.hatchegg .half { position: absolute; inset: 0; }
.hatchegg .half.top { animation: shell-top .8s 1s var(--out) forwards; }
.hatchegg .half.bot { animation: shell-bot .8s 1s var(--out) forwards; }
@keyframes egg-shake { 25% { transform: rotate(-9deg); } 75% { transform: rotate(9deg); } }
@keyframes shell-top { to { transform: translate(-40px, -90px) rotate(-50deg); opacity: 0; } }
@keyframes shell-bot { to { transform: translateY(60px) rotate(10deg); opacity: 0; } }
.hatching .cutout .art { animation: pop .7s 1.1s var(--spring) both, idle 2.6s 2s ease-in-out infinite; }

/* общая анимация */
@keyframes pop { from { transform: scale(.4); opacity: 0; } }
@keyframes drop-in { from { transform: translateY(-20px); opacity: 0; } }
@keyframes rise-in { from { transform: translateY(14px); opacity: 0; } }
.pill, .round, .tab, .chip, .iconbtn, .row button, .about { transition: transform .35s var(--spring), background-color .2s, color .2s, box-shadow .2s; }
.pill:active, .round:active, .chip:active, .iconbtn:active, .row button:active { transform: scale(.92); transition-duration: .08s; }
.tab:active svg { transform: scale(.82); }
.spark { position: absolute; pointer-events: none; z-index: 40; width: 16px; height: 16px; animation: spark .8s var(--out) forwards; }
@keyframes spark { from { transform: translate(-50%, -50%) scale(.4); opacity: 1; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1) rotate(var(--rot)); opacity: 0; } }
.card, .tab, .pill, .round { -webkit-user-select: none; user-select: none; }

/* переходы между экранами */
html.vt .screen { animation: none; }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .42s; animation-timing-function: var(--out); }
html[data-nav="fwd"]::view-transition-old(root) { animation-name: vt-out-left; }
html[data-nav="fwd"]::view-transition-new(root) { animation-name: vt-in-right; }
html[data-nav="back"]::view-transition-old(root) { animation-name: vt-out-right; }
html[data-nav="back"]::view-transition-new(root) { animation-name: vt-in-left; }
html[data-nav="tab"]::view-transition-old(root) { animation: vt-fade-out .2s ease both; }
html[data-nav="tab"]::view-transition-new(root) { animation: vt-fade-in .26s ease both; }
html[data-nav="zoom"]::view-transition-old(root) { animation: vt-fade-out .3s ease both; }
html[data-nav="zoom"]::view-transition-new(root) { animation: vt-fade-in .3s ease both; }
html[data-nav="fade"]::view-transition-old(root) { animation: vt-fade-out .35s ease both; }
html[data-nav="fade"]::view-transition-new(root) { animation: vt-rise .5s var(--out) both; }
@keyframes vt-in-right { from { transform: translateX(28%); opacity: 0; } }
@keyframes vt-out-left { to { transform: translateX(-16%); opacity: 0; } }
@keyframes vt-in-left { from { transform: translateX(-16%); opacity: 0; } }
@keyframes vt-out-right { to { transform: translateX(28%); opacity: 0; } }
@keyframes vt-fade-in { from { opacity: 0; } }
@keyframes vt-fade-out { to { opacity: 0; } }
@keyframes vt-rise { from { transform: translateY(24px) scale(.98); opacity: 0; } }
::view-transition-group(hero) { animation-duration: .55s; animation-timing-function: cubic-bezier(.3, 1.25, .4, 1); }
::view-transition-group(tabbar), ::view-transition-group(tabpill) { animation-duration: .38s; animation-timing-function: var(--spring); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
  ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
}

      }
    }
    if (state.screen === "profile") {
      var tiles = document.getElementById("pfTiles"); if (!tiles) return;
      tiles.innerHTML =
        '<div><b data-n="' + state.orders + '">' + state.orders + '</b><small>' + plural(state.orders, "заказ", "заказа", "заказов") + '</small></div>' +
        '<div><b data-n="' + state.liked.length + '">' + state.liked.length + '</b><small>' + plural(state.liked.length, "мэтч", "мэтча", "мэтчей") + '</small></div>' +
        '<div><b data-n="' + saved() + '" data-rub="1">' + rub(saved()) + '</b><small>сэкономлено</small></div>';
      if (first) tiles.querySelectorAll("b").forEach(function (b) { countUp(b, +b.dataset.n, b.dataset.rub ? rub : String); });
      document.getElementById("pfOrders").innerHTML = state.orderList.length ? state.orderList.slice().reverse().map(function (o, i) {
        return '<div class="row" style="animation-delay:' + (0.15 + i * 0.06).toFixed(2) + 's"><div class="thumb" style="background:' + o.p.bg + '">' + o.p.art() + '</div><div class="t">' + esc(o.p.name) + '<small>' + o.num + ' · ' + esc(o.p.what) + (o.size ? ', ' + o.size : '') + '</small></div><b class="osum">' + rub(o.p.price) + '</b></div>';
      }).join("") : '<p class="none">Пока нет заказов. Смахните понравившуюся цыпу вправо.</p>';
    }
  }

  function openLiked(screenEl) {
    var body = state.liked.length ? state.liked.map(function (p) {
      return '<div class="row"><div class="thumb" style="background:' + p.bg + '">' + p.art() + '</div><div class="t">' + esc(p.name) + '<small>' + esc(p.what) + ' · ' + rub(p.price) + '</small></div>' +
        (isBought(p) ? '<button type="button" class="bought" data-open="' + p.id + '">Куплено</button>' : '<button type="button" data-id="' + p.id + '">Купить</button>') + '</div>';
    }).join("") : '<p style="color:var(--muted);margin:0 0 6px">Пока пусто. Смахните карточку вправо, чтобы получить мэтч.</p>';
    var bg = sheet(screenEl, "мои мэтчи", body);
    bg.addEventListener("click", function (e) {
      var b = e.target.closest("button[data-id], button[data-open]"); if (!b) return;
      var id = b.dataset.id || b.dataset.open;
      state.current = byId(id);
      state.backTo = state.screen;
      var thumb = b.closest(".row").querySelector(".thumb");
      thumb.style.viewTransitionName = "hero";
      go("product", "fwd");
    });
  }

  var STAT = {
    hunger: { t: "сытость", c: "#FFD60A", icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="#151515"><ellipse cx="8" cy="9" rx="3" ry="4.5" transform="rotate(-20 8 9)"/><ellipse cx="16" cy="9" rx="3" ry="4.5" transform="rotate(20 16 9)"/><ellipse cx="12" cy="17" rx="3" ry="4.5"/></svg>' },
    clean: { t: "чистота", c: "#36C8FF", icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="#151515"><path d="M12 2s7 8 7 13a7 7 0 0 1-14 0c0-5 7-13 7-13z"/></svg>' },
    fun: { t: "радость", c: "#FF3D8B", icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="#151515"><path d="M12 21s-7.5-4.6-9.5-9.3C1.1 8.4 3.2 4.5 7 4.5c2 0 3.5 1.1 5 3 1.5-1.9 3-3 5-3 3.8 0 5.9 3.9 4.5 7.2C19.5 16.4 12 21 12 21z"/></svg>' },
    energy: { t: "энергия", c: "#A99BFF", icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="#151515"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>' }
  };
  var STATS = ["hunger", "clean", "fun", "energy"];
  var MOON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>';
  var SUN = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4.5" fill="#fff"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>';
  var ACT_ICON = {
    feed: '<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><ellipse cx="8" cy="9" rx="3" ry="4.5" transform="rotate(-20 8 9)"/><ellipse cx="16" cy="9" rx="3" ry="4.5" transform="rotate(20 16 9)"/><ellipse cx="12" cy="17" rx="3" ry="4.5"/></svg>',
    wash: '<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M12 2s7 8 7 13a7 7 0 0 1-14 0c0-5 7-13 7-13z"/></svg>',
    play: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><path d="M3.5 9.5c5 2 12 2 17 0M3.5 14.5c5-2 12-2 17 0"/></svg>'
  };

  function clamp(v) { return Math.max(0, Math.min(100, v)); }
  function product(id) { return PRODUCTS.find(function (p) { return p.id === id; }); }

  function adopt(p) {
    state.pet = { id: p.id, name: p.name, hunger: 70, clean: 85, fun: 60, energy: 80, sleeping: false, born: Date.now(), t: Date.now() };
  }
  function ensurePet() { if (!state.pet) adopt(PRODUCTS[1]); }

  // настроение: что сейчас нужнее всего
  function moodOf(pet) {
    if (pet.sleeping) return { key: "sleep", text: "спит" };
    var low = STATS.slice().sort(function (a, b) { return pet[a] - pet[b]; })[0];
    if (pet[low] >= 65) return { key: "happy", text: "счастлив" };
    if (pet[low] >= 40) return { key: "ok", text: "всё хорошо" };
    return { hunger: { key: "hungry", text: "проголодался" }, clean: { key: "dirty", text: "испачкался" }, fun: { key: "bored", text: "скучает" }, energy: { key: "tired", text: "устал, хочет спать" } }[low];
  }
  function petSVG(pet, moodKey) {
    var eyes = { happy: "happy", ok: null, hungry: "sad", dirty: null, bored: "bored", tired: "bored", sleep: "sleep" }[moodKey];
    var dirt = pet.clean < 55 ? (0.25 + 0.75 * (1 - pet.clean / 55)).toFixed(2) : 0;
    return bird(Object.assign({}, LOOKS[pet.id] || {}, { mood: eyes, dirt: dirt }));
  }


  // цыпа живёт в реальном времени: за час немного голодает, пачкается, скучает и устаёт
  var RATE = { hunger: 6, clean: 4, fun: 5, energy: 3 };
  function tickPet() {
    var pet = state.pet; if (!pet) return;
    var hrs = (Date.now() - (pet.t || Date.now())) / 3600000;
    if (hrs <= 0) return;
    // во сне всё тратится медленнее, а энергия растёт (как в приложении для часов)
    STATS.forEach(function (s) {
      if (s === "energy" && pet.sleeping) pet.energy = clamp(pet.energy + 25 * hrs);
      else pet[s] = clamp(pet[s] - RATE[s] * hrs * (pet.sleeping ? 0.35 : 1));
    });
    if (pet.sleeping && pet.energy >= 100) pet.sleeping = false;
    pet.t = Date.now();
    save();
  }
  // цыпу могли покормить или уложить спать на часах (другая вкладка или окно): берём её свежее состояние
  window.addEventListener("storage", function (e) {
    if (e.key !== STORE || !e.newValue) return;
    try {
      var d = JSON.parse(e.newValue);
      if (JSON.stringify(d.pet) === JSON.stringify(state.pet)) return;
      var had = !!state.pet;
      state.pet = d.pet || null;
      if (state.screen === "mypet") { if (had && state.pet) refreshPhone(); else go("mypet", "tab"); }
      else if (state.screen === "profile") refreshPhone();
    } catch (err) {}
  });
  setInterval(function () { tickPet(); if (state.screen === "mypet" || state.screen === "profile") refreshPhone(); }, 30000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) { tickPet(); refreshPhone(); } });

  load();
  tickPet();
  go("splash");

  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
})();
</script>
</body>
</html>
