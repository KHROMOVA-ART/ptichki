<title>Птички: мерч</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: two devices side by side on a sky backdrop (stacked on narrow screens); the apps run inside them. */
:root {
  --page: #E9E7E2;
  --page-2: #F6F5F2;
  --frame: #11131B;
  --frame-edge: #2A2F3D;
  --strap: #FF7FB6;
  --strap-edge: #FF3D8B;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --page: #1B1A18; --page-2: #2A2825; color-scheme: dark; }
}
:root[data-theme="dark"] { --page: #1B1A18; --page-2: #2A2825; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(120% 80% at 20% 0%, var(--page-2), var(--page) 60%) fixed, var(--page);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
.stagepage { min-height: 100%; display: flex; align-items: center; justify-content: center; gap: clamp(24px, 5vw, 72px); flex-wrap: wrap; padding-block: 32px; }
.fit { position: relative; flex: none; }
.dev { position: absolute; top: 0; left: 0; transform-origin: 0 0; }

/* iPhone */
.phone { width: 390px; height: 812px; border-radius: 58px; background: var(--frame); padding: 11px; box-shadow: 0 0 0 2px var(--frame-edge) inset, 0 40px 80px -30px rgba(21,21,21,.45); }
.phone .scr { position: relative; width: 100%; height: 100%; border-radius: 48px; overflow: hidden; background: #F3F2EF; }
.phone iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
.island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 32%; height: 31px; background: #000; border-radius: 20px; z-index: 3; pointer-events: none; }
.status { position: absolute; top: 0; left: 0; right: 0; height: 52px; display: flex; justify-content: space-between; align-items: center; padding: 6px 32px 0; font: 600 15px -apple-system, system-ui, sans-serif; color: #151515; z-index: 3; pointer-events: none; }
.status .icons { display: flex; gap: 6px; align-items: center; }
.bat { width: 25px; height: 12px; border: 1.5px solid currentColor; border-radius: 4px; position: relative; }
.bat::after { content: ""; position: absolute; inset: 1.5px; right: 5px; background: currentColor; border-radius: 1.5px; }
.homebar { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 36%; height: 5px; border-radius: 3px; background: #151515; z-index: 3; pointer-events: none; }

/* Apple Watch */
.watch { width: 250px; height: 330px; }
.strap { position: absolute; left: 44px; width: 146px; height: 60px; background: linear-gradient(90deg, var(--strap-edge), var(--strap) 50%, var(--strap-edge)); }
.strap.t { top: 0; border-radius: 18px 18px 0 0; }
.strap.b { bottom: 0; border-radius: 0 0 18px 18px; }
.case { position: absolute; left: 6px; top: 35px; width: 222px; height: 260px; border-radius: 62px; background: linear-gradient(145deg, #3A4152, #12151E 60%); padding: 12px; box-shadow: 0 30px 50px -24px rgba(21,21,21,.45), inset 0 0 0 2px #4A5266; }
.case .scr { width: 198px; height: 236px; border-radius: 48px; overflow: hidden; background: #000; position: relative; }
.case iframe { width: 100%; height: 100%; border: 0; display: block; }
.crown, .sidebtn { position: absolute; border: none; cursor: pointer; padding: 0; }
.crown { right: -10px; top: 70px; width: 13px; height: 38px; border-radius: 5px; background: repeating-linear-gradient(180deg, #59617A 0 2px, #3A4152 2px 4px); }
.sidebtn { right: -7px; top: 130px; width: 8px; height: 52px; border-radius: 4px; background: #3A4152; }
.crown:focus-visible, .sidebtn:focus-visible { outline: 2px solid #151515; outline-offset: 3px; }
.crown:active { transform: translateY(2px); }
</style>

<main class="stagepage">
  <div class="fit" id="pfit">
    <div class="dev phone" id="phone" aria-label="iPhone">
      <div class="scr">
        <iframe src="phone.html" title="Приложение «Птички» на iPhone"></iframe>
        <div class="island"></div>
        <div class="status"><span id="clock">9:41</span><span class="icons"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><span class="bat" aria-hidden="true"></span></span></div>
        <div class="homebar"></div>
      </div>
    </div>
  </div>

  <div class="fit" id="wfit">
    <div class="dev watch" id="watch" aria-label="Apple Watch">
      <div class="strap t"></div><div class="strap b"></div>
      <div class="case">
        <button class="crown" type="button" id="crown" aria-label="Колёсико Digital Crown: к цыпе"></button>
        <button class="sidebtn" type="button" id="side" aria-label="Боковая кнопка: к цыпе"></button>
        <div class="scr"><iframe id="wframe" src="watch.html" title="Приложение «Птички» на Apple Watch"></iframe></div>
      </div>
    </div>
  </div>
</main>

<script>
(function () {
  var pfit = document.getElementById("pfit"), wfit = document.getElementById("wfit");
  var phone = document.getElementById("phone"), watch = document.getElementById("watch");
  function fit() {
    var vw = document.documentElement.clientWidth - 32, vh = window.innerHeight - 64;
    var side = vw >= 390 + 250 + 48;
    var s = side ? Math.min(1, vh / 812, (vw - 48) / 640) : Math.min(1, vw / 390, Math.max(vh, 560) / 812);
    s = Math.max(s, 0.45);
    pfit.style.width = 390 * s + "px"; pfit.style.height = 812 * s + "px";
    wfit.style.width = 250 * s + "px"; wfit.style.height = 330 * s + "px";
    phone.style.transform = "scale(" + s + ")";
    watch.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);
  fit();

  // время в статус-баре — настоящее
  function tick() { var d = new Date(); document.getElementById("clock").textContent = d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0"); }
  tick(); setInterval(tick, 15000);

  // колёсико и боковая кнопка часов возвращают к цыпе
  function crown() { var f = document.getElementById("wframe"); if (f && f.contentWindow) f.contentWindow.postMessage("crown", "*"); }
  document.getElementById("crown").addEventListener("click", crown);
  document.getElementById("side").addEventListener("click", crown);
})();
</script>
